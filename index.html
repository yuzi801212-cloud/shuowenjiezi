<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>大家的说文解字</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="https://unpkg.com/pdfjs-dist@5.4.530/build/pdf.min.mjs"></script>
  <script type="module" src="https://unpkg.com/pdfjs-dist@5.4.530/build/pdf.worker.min.mjs"></script>
</head>

<body>
  <div id="app">
    <aside id="search-panel">
      <div class="page-comments">注意：<br>所涉页码均为pdf文件页码<br>pdf页码 = 影印页码+14<br>原书已被每10页分割<br>使用右面的上下箭头浏览前后10页</div>      
      <h1 style="text-align: center;">&#x2665;&#xfe0f;人人为我&#x2665;&#xfe0f;</h1>
      <hr style="width:100%;text-align:left;margin-left:0" />
      <h1>查字索引</h1>
      <div class="controls">
        <input id="char-input" placeholder="输入汉字后回车或点 搜索" />
        <button id="search-btn">搜索</button>
      </div>
      <div id="result"></div>
      <h1>去到页面</h1>
      <div class="controls-goto-page">
        <input id="goto-page-input" type="number" placeholder="[1-942]" min="1" max="942" />
        <button id="goto-page-btn">去到</button>
      </div>
      <div id="goto-page-result"></div>
      <!-- <div>
        <strong>索引示例</strong>
        <pre id="index-preview"></pre>
      </div> -->
      <h1 style="text-align: center;">&#x2665;&#xfe0f;我为人人&#x2665;&#xfe0f;</h1>
      <hr style="width:100%;text-align:left;margin-left:0" />
      <h1>添加索引</h1>
      <div class="insert-controls">
        <input id="new-char" placeholder="汉字，多个汉字用空格分隔" maxlength="50" />
        <input id="new-page" placeholder="pdf页码" type="number" min="1" />
        <button id="insert-btn">添加</button>
      </div>
      <div id="insert-result"></div>
      <div class="page-comments">pdf页码 = 影印页码+14</div>
      <hr />
    </aside>

    <main id="viewer-panel">
      <div id="pdf-controls">
        <span id="page-info"></span>
      </div>
      <div id="pdf-container"></div>
    </main>
  </div>
  <!-- Right-side PDF navigation -->
  <div id="pdf-nav" aria-hidden="false">
    <button id="pdf-prev" class="pdf-nav-btn" aria-label="Previous PDF">▲</button>
    <button id="pdf-next" class="pdf-nav-btn" aria-label="Next PDF">▼</button>
  </div>
  <script type="module" src="app.mjs"></script>
</body>

</html>
